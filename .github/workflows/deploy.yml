name: CI
on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test tweet previews
        run: bun test scripts/tweet.test.ts

      - name: Check production build
        run: bun run test:production
